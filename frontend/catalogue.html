<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catalogue — Artify</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/catalogue.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">Artify</a>
    <button class="burger" id="burger">&#9776;</button>
    <nav class="nav-liens" id="nav-liens">
      <a href="catalogue.html" class="actif">Catalogue</a>
      <a href="artiste.html">Artistes</a>
      <a href="login.html">Connexion</a>
    </nav>
  </header>

  <section class="page-entete">
    <div class="page-entete-contenu">
      <p class="section-label">Toutes les œuvres</p>
      <h1>Catalogue</h1>
      <p class="page-entete-desc" id="catalogue-desc">Chargement du catalogue…</p>
    </div>
  </section>

  <!-- BARRE DE FILTRES -->
  <div class="barre-filtres">
    <div class="filtres-gauche">
      <button class="filtre-btn actif" data-filtre="tous">Tous</button>
      <button class="filtre-btn" data-filtre="peinture">Peinture</button>
      <button class="filtre-btn" data-filtre="photographie">Photographie</button>
      <button class="filtre-btn" data-filtre="sculpture">Sculpture</button>
      <button class="filtre-btn" data-filtre="aquarelle">Aquarelle</button>
    </div>
    <div class="filtres-droite">
      <div class="filtres-statut">
        <button class="filtre-btn filtre-sm actif" data-statut="">Tous</button>
        <button class="filtre-btn filtre-sm" data-statut="disponible">Dispo</button>
        <button class="filtre-btn filtre-sm" data-statut="vendu">Vendu</button>
      </div>
      <select class="filtre-select" id="tri">
        <option value="recent">Plus récent</option>
        <option value="prix_asc">Prix ↑</option>
        <option value="prix_desc">Prix ↓</option>
      </select>
      <span class="compteur-resultats">— œuvres</span>
    </div>
  </div>

  <!-- GRILLE -->
  <section class="catalogue-contenu">
    <div class="grille-catalogue" id="grille-catalogue">
      <div class="loader-art" style="grid-column:1/-1;"><div class="loader-anneau"></div></div>
    </div>
    <div id="pagination"></div>
  </section>

  <!-- MODALE DÉTAIL OEUVRE -->
  <div id="modale-overlay" style="display:none;" onclick="fermerModale(event)">
    <div class="modale-detail">
      <button class="modale-fermer" onclick="fermerModale(null)">✕</button>
      <div id="modale-corps"></div>
    </div>
  </div>

  <footer class="pied-page">
    <div class="pied-haut">
      <div class="pied-marque"><span class="logo">Artify</span><p>Une galerie d'art en ligne dédiée à la création contemporaine.</p></div>
      <div class="pied-liens"><h4>Galerie</h4><a href="catalogue.html">Catalogue</a><a href="artiste.html">Artistes</a></div>
      <div class="pied-liens"><h4>Compte</h4><a href="login.html">Connexion</a><a href="profil.html">Mon profil</a></div>
      <div class="pied-liens"><h4>Infos</h4><a href="#">À propos</a><a href="#">Contact</a></div>
    </div>
    <div class="pied-bas"><span>© 2026 Artify. Tous droits réservés.</span></div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/catalogue.js"></script>
  <script>
    document.getElementById('burger').addEventListener('click', () =>
      document.getElementById('nav-liens').classList.toggle('ouvert'));
  </script>
</body>
</html>
